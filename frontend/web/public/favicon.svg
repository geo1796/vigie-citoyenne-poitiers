<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vigie Citoyenne">
  <!-- Clair : bleu civique ≈ oklch(0.42 0.13 245). Sombre : teinte éclaircie pour le contraste sur onglet foncé. -->
  <style>
    .vigie { color: #0d568f; }
    @media (prefers-color-scheme: dark) { .vigie { color: #6aa8e0; } }
  </style>
  <g class="vigie">
    <g fill="none" stroke="currentColor" stroke-width="2.4">
      <circle cx="16" cy="16" r="13" opacity="0.22"/>
      <circle cx="16" cy="16" r="8.5" opacity="0.5"/>
    </g>
    <circle cx="16" cy="16" r="4" fill="currentColor"/>
  </g>
</svg>
